stacks:
  rewrite-template:
    corefile: |
      example.test:53 {
          @MULTISOCKET@
          rewrite name suffix .alias.example.test .example.test
          template IN A tmpl.example.test {
              answer "{{ .Name }} 60 IN A 192.0.2.1"
              fallthrough
          }
          template ANY ANY example.test {
              match ^x[0-9]+[.]example[.]test[.]$
              rcode NXDOMAIN
              fallthrough
          }
          hosts /etc/bench/hosts example.test
      }
    services:
      dut:
        - { name: hosts-data, level: 0, count: 100000, zone: example.test }
      loadgen:
        - name: queries
          families:
            - "h{}.alias.example.test,0.5,100000"
            - "t{}.tmpl.example.test,0.3,50000"
            - "h{}.example.test,0.2,100000"
          types: "A=70,AAAA=30"
          nx: 0.05
          nx_pattern: "x{}.example.test"
          probe: { name: h1.example.test, type: A, answer: true }
