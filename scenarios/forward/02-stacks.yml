stacks:
  forward:
    corefile: |
      .:53 {
          @MULTISOCKET@
          forward . @UPSTREAM@
      }
    services:
      backend:
        - { name: nsd, zone: up.test }
      loadgen:
        - name: queries
          families: ["h{}.h.up.test,1.0,1000000"]
          nx: 0.07
          nx_pattern: "x{}.up.test"
          probe: { name: h1.h.up.test, type: A, answer: true }
