uses: [whoami, cache]
experiments:
  - name: scale-whoami
    stack: whoami
    servers: [pharos, coredns]
    dut_cores: [1, 2, 4, 8]
    protocols: { peak: [udp], sweep: [] }
    reps: 3
  - name: scale-cache
    stack: cache-hit95
    servers: [pharos, coredns]
    dut_cores: [1, 2, 4, 8]
    protocols: { peak: [udp], sweep: [] }
    reps: 3
