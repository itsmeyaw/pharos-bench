uses: [whoami, hosts, forward]
experiments:
  - { name: whoami-tcp,  stack: whoami,  servers: [pharos, pharos-before, coredns], protocols: { peak: [tcp] }, reps: 3, warmup: 5, duration: 15 }
  - { name: hosts-tcp,   stack: hosts,   servers: [pharos, pharos-before, coredns], protocols: { peak: [tcp] }, reps: 3, warmup: 5, duration: 15 }
  - { name: forward-tcp, stack: forward, servers: [pharos, pharos-before, coredns], protocols: { peak: [tcp] }, reps: 3, warmup: 5, duration: 15 }
