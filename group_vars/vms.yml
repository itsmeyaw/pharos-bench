ansible_user: bench
ansible_ssh_private_key_file: "{{ bench_ssh_key }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  -o ProxyCommand="ssh -W %h:%p -q -i {{ hostvars[bench_host_name].ansible_ssh_private_key_file | default(bench_ssh_key) }}
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  -p {{ hostvars[bench_host_name].ansible_port | default(22) }}
  {{ hostvars[bench_host_name].ansible_user | default('root') }}@{{ hostvars[bench_host_name].ansible_host }}"
# No connection multiplexing to the VMs: a master surviving the dut reboot hangs until keepalives expire.
ansible_ssh_args: -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3
ansible_python_interpreter: /usr/bin/python3
